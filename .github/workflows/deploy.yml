
name: Deploy Flutter Web (main and preview)

on:
  push:
    branches:
      - main
      - feature-cart
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Checkout feature-cart
        uses: actions/checkout@v4
        with:
          ref: feature-cart
          path: preview-source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build main site
        working-directory: main-source
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons --base-href "/my_menu/"

      - name: Build preview site
        working-directory: preview-source
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons --base-href "/my_menu/preview/"

      - name: Combine sites
        run: |
          mkdir -p site
          cp -a main-source/build/web/. site/
          mkdir -p site/preview
          cp -a preview-source/build/web/. site/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
