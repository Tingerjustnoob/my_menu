name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download dependencies
        run: flutter pub get

      # The repository previously stored a Flutter web build in web/.
      # Remove only generated files in the runner so source files cannot
      # override the fresh build placed in build/web/.
      - name: Remove stale generated web files
        run: |
          rm -rf web/assets web/canvaskit
          rm -f web/main.dart.js web/flutter.js web/flutter_bootstrap.js web/flutter_service_worker.js web/version.json

      - name: Build web app
        run: flutter build web --release --base-href "/my_menu/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
